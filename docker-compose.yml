services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius
    ports:
      - "5432:5432"
    volumes:
      - sirius_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sirius_postgres:
